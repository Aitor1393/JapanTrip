name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancelan los que ya están en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Validar data/viajes.json
        run: python3 -c "import json;json.load(open('data/viajes.json'));print('JSON correcto')"

      # Pages tiene que estar activado a mano una vez en
      # Settings → Pages → Source: GitHub Actions. El token del workflow no
      # puede crear el sitio («Resource not accessible by integration»), así
      # que enablement: true no sirve de nada aquí.
      - uses: actions/configure-pages@v6

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v5
